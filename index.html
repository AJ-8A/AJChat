<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b141a">
  <meta name="description" content="AJChat — an original glass-style realtime messaging interface.">
  <title>AJChat — Messages</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="app-shell">
    <section class="messenger" aria-label="AJChat messenger">
      <aside class="sidebar" id="sidebar">
        <header class="sidebar-top">
          <div class="brand">
            <div class="brand-mark">AJ</div>
            <div>
              <strong>AJChat</strong>
              <span>Private • Fast • Global</span>
            </div>
          </div>

          <div class="sidebar-actions">
            <button class="icon-button" id="newChatButton" type="button" aria-label="Start new chat">＋</button>
            <button class="icon-button" id="newGroupButton" type="button" aria-label="Create group">◎</button>
            <button class="icon-button" id="themeButton" type="button" aria-label="Toggle theme">◐</button>
          </div>
        </header>

        <div class="search-wrap">
          <label class="search-box" for="chatSearch">
            <span>⌕</span>
            <input id="chatSearch" type="search" placeholder="Search chats" autocomplete="off">
            <kbd>/</kbd>
          </label>
        </div>

        <div class="filter-pills" role="tablist" aria-label="Chat filters">
          <button class="filter-pill active" data-filter="all" type="button">All</button>
          <button class="filter-pill" data-filter="unread" type="button">Unread</button>
          <button class="filter-pill" data-filter="groups" type="button">Groups</button>
        </div>

        <section class="friend-requests" id="friendRequestsSection" hidden>
          <div class="requests-heading">
            <div>
              <strong>Friend requests</strong>
              <span id="requestCount">0 waiting</span>
            </div>
          </div>
          <div class="request-list" id="requestList"></div>
        </section>

        <section class="online-strip" id="onlineStrip" hidden>
          <div class="online-heading">
            <strong>Online now</strong>
            <span id="onlineCount">0</span>
          </div>
          <div class="online-avatars" id="onlineAvatars"></div>
        </section>

        <div class="chat-list" id="chatList"></div>


      </aside>

      <section class="chat-panel" id="chatPanel">
        <header class="chat-header">
          <button class="mobile-only icon-button" id="backButton" type="button" aria-label="Back to chats">‹</button>

          <div class="chat-person">
            <div class="avatar" id="chatAvatar">AJ</div>
            <div>
              <strong id="chatName">Select a friend</strong>
              <span id="chatStatus">waiting for connection</span>
            </div>
          </div>

          <div class="chat-actions">
            <button class="icon-button" type="button" title="Search in chat">⌕</button>
            <button class="icon-button" type="button" title="Start video call">◉</button>
            <button class="icon-button" type="button" title="More">•••</button>
          </div>
        </header>

        <div class="chat-scene">
          <div class="date-chip">Today</div>
          <div class="messages" id="messages" aria-live="polite"></div>
          <div class="typing-row hidden" id="typingRow">
            <div class="typing-avatar avatar">AJ</div>
            <div class="typing-bubble">
              <i></i><i></i><i></i>
            </div>
          </div>
        </div>

        <form class="composer" id="composer">
          <button class="icon-button" type="button" id="emojiButton" aria-label="Add emoji">☺</button>
          <button class="icon-button" type="button" id="attachButton" aria-label="Attach">＋</button>
          <input id="messageInput" type="text" maxlength="500" placeholder="Write a message…" autocomplete="off" aria-label="Message">
          <button class="send-button" type="submit" aria-label="Send message">➤</button>
        </form>
      </section>

      <!-- Friend details panel removed: the main chat stays focused on real conversations. -->
    </section>
  </main>


  <div class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="brand auth-brand"><div class="brand-mark">AJ</div><div><strong>AJChat</strong><span>Real friends. Real messages.</span></div></div>
      <div class="auth-copy"><span class="eyebrow">PRIVATE MESSAGING</span><h1>Talk to your people.</h1><p>Create your AJChat account, find your friends, and message across devices.</p></div>
      <form id="authForm" class="auth-form">
        <label>Username<input id="authUsername" name="username" minlength="3" maxlength="24" autocomplete="username" required placeholder="Choose a username"></label>
        <label>Password<input id="authPassword" name="password" minlength="8" maxlength="72" type="password" autocomplete="current-password" required placeholder="At least 8 characters"></label>
        <button class="button auth-submit" id="authSubmit" type="submit">Sign in</button>
      </form>
      <button class="auth-switch" id="authSwitch" type="button">New here? Create an account</button>
      <p class="auth-message" id="authMessage" role="status"></p>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
